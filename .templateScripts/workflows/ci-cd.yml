name: CI/CD Pipeline

on:
  push:
    branches: ['master', 'main', 'dev', 'development']
  pull_request:
    branches: ['master', 'main', 'dev', 'development']
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write
  checks: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip on automated release commits to prevent recursive trigger
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    strategy:
      fail-fast: true
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and Build Packages (Workspaces)
        uses: ./.github/actions/setup-node-build
        with:
          node-version: ${{ matrix.node-version }}
          build-command: 'npm run build'

      - name: Run Tests
        run: npm run test --if-present

      - name: Build Root App
        run: npm run build

  code-health:
    name: Project Doctor & Code Health
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pull-requests: write
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Project Doctor
        id: doctor
        continue-on-error: true
        run: npm run lint:doctor

      - name: Publish Job Summary
        if: always()
        run: cat health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report Health to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.existsSync('health-report.md')
              ? fs.readFileSync('health-report.md', 'utf8')
              : 'Health report was not generated — see the "Run Project Doctor" step logs.';

            const marker = '<!-- project-doctor-report -->';
            const truncate = (str, max) =>
              str.length > max
                ? `${str.substring(0, max)}\n\n... (truncated — run \`npm run lint:doctor\` locally for the full report)`
                : str;
            const commentBody = `${marker}\n${truncate(report, 60000)}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Enforce Minimum Passing Grade
        if: steps.doctor.outcome == 'failure'
        run: exit 1

  release:
    name: Semantic Release
    needs: code-health
    runs-on: ubuntu-latest
    if: >-
      github.event.repository.fork == false &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/development' || github.event_name == 'workflow_dispatch')
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

{{DEPLOY_JOBS}}
