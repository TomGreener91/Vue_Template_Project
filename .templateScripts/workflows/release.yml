name: Release

on:
  workflow_run:
    workflows: ['CI']
    branches:
      - master
      - main
      - dev
      - development
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Prevent this workflow from running on forks and ensure CI succeeded (or manual dispatch was used)
    if: >-
      github.event.repository.fork == false &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # In workflow_run, checkout the specific branch that triggered the CI run
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          # This is required to analyze the commit history
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          # Using the default GITHUB_TOKEN is fine here because we are explicitly calling the next job
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-publish:
    name: Trigger Publish
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    # Note: The setup script will automatically replace this placeholder with the chosen template's publish workflow.
    uses: ./.github/workflows/publish-placeholder.yml
    with:
      version: ${{ needs.release.outputs.new_release_version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}