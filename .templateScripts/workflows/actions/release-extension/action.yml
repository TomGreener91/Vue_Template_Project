name: 'Build and Release Browser Extension'
description: 'Builds browser extension, creates zip package, and uploads artifact to GitHub Releases'

inputs:
  version:
    description: 'The release version tag (without leading v)'
    required: true
  build-command:
    description: 'Command to build extension'
    required: false
    default: 'npm run build'
  dist-path:
    description: 'Path to build output directory'
    required: false
    default: 'dist'
  artifact-name:
    description: 'Name of the zip archive output'
    required: false
    default: 'extension.zip'

runs:
  using: 'composite'
  steps:
    - name: Setup Node and Build Extension
      uses: ./.github/actions/setup-node-build
      with:
        build-command: ${{ inputs.build-command }}

    - name: Package Extension
      shell: bash
      run: |
        cd ${{ inputs.dist-path }}
        zip -r ../${{ inputs.artifact-name }} .

    - name: Determine Release Type
      if: github.event_name != 'pull_request'
      id: release_type
      shell: bash
      run: |
        if [[ "${{ inputs.version }}" =~ -dev ]]; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
          echo "latest=false" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
          echo "latest=true" >> $GITHUB_OUTPUT
        fi

    - name: Upload Artifact to Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ inputs.version }}
        files: ${{ inputs.artifact-name }}
        prerelease: ${{ steps.release_type.outputs.prerelease }}
        make_latest: ${{ steps.release_type.outputs.latest }}
